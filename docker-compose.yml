services:
  app:
    build: .docker/php
    ports:
      - "8080:80"
    volumes:
      - "./scr:/var/www/html"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda_contatos
    ports:
      - "3306:3306"
    volumes:
      - "./data:/var/lib/mysql"